{% extends "base.html" %}

{% block title %}Edit Table - {{ table.table_number }}{% endblock %}

{% block page_header %}
<div class="page-header">
    <div>
        <h1><i class="bi bi-pencil-square me-2 text-primary-brand"></i>Edit Table</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('dashboard.index') }}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('tables.index') }}">Tables</a></li>
                <li class="breadcrumb-item active">Edit {{ table.table_number }}</li>
            </ol>
        </nav>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm-custom">
            <div class="card-header bg-white">
                <h5 class="mb-0 text-secondary">Edit Table Details</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('tables.edit', table_id=table.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label for="table_number" class="form-label">Table Number / Label <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="table_number" name="table_number" value="{{ table.table_number }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="capacity" class="form-label">Seating Capacity <span class="text-danger">*</span></label>
                        <input type="number" min="1" max="50" class="form-control" id="capacity" name="capacity" value="{{ table.capacity }}" required>
                    </div>

                    <div class="mb-4">
                        <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="Available" {% if table.status == 'Available' %}selected{% endif %}>Available</option>
                            <option value="Occupied" {% if table.status == 'Occupied' %}selected{% endif %}>Occupied</option>
                            <option value="Reserved" {% if table.status == 'Reserved' %}selected{% endif %}>Reserved</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('tables.index') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i> Update Table</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
