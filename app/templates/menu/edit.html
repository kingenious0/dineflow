{% extends "base.html" %}

{% block title %}Edit Menu Item - {{ item.name }}{% endblock %}

{% block page_header %}
<div class="page-header">
    <div>
        <h1><i class="bi bi-pencil-square me-2 text-primary-brand"></i>Edit Menu Item</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('dashboard.index') }}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('menu.index') }}">Menu Catalog</a></li>
                <li class="breadcrumb-item active">Edit {{ item.name }}</li>
            </ol>
        </nav>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm-custom">
            <div class="card-header bg-white">
                <h5 class="mb-0 text-secondary">Edit Dish Details</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('menu.edit', item_id=item.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label for="name" class="form-label">Item Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ item.name }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="Main Course" {% if item.category == 'Main Course' %}selected{% endif %}>Main Course</option>
                                <option value="Appetizer" {% if item.category == 'Appetizer' %}selected{% endif %}>Appetizer</option>
                                <option value="Beverage" {% if item.category == 'Beverage' %}selected{% endif %}>Beverage</option>
                                <option value="Dessert" {% if item.category == 'Dessert' %}selected{% endif %}>Dessert</option>
                                <option value="Side Dish" {% if item.category == 'Side Dish' %}selected{% endif %}>Side Dish</option>
                                <option value="Special" {% if item.category == 'Special' %}selected{% endif %}>Special</option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="price" class="form-label">Price (GH₵) <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">GH₵</span>
                                <input type="number" step="0.50" min="0" class="form-control" id="price" name="price" value="{{ "%.2f"|format(item.price) }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label">Status <span class="text-danger">*</span></label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="Available" {% if item.status == 'Available' %}selected{% endif %}>Available</option>
                                <option value="Unavailable" {% if item.status == 'Unavailable' %}selected{% endif %}>Unavailable</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label">Description / Ingredients</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ item.description or '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('menu.index') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i> Update Menu Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
