{% extends "base.html" %}
{% block title %}Internal Server Error{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-warning fw-bold"><i class="bi bi-bug"></i> 500</div>
    <h3 class="fw-bold mt-3">Internal Server Error</h3>
    <p class="text-muted">An unexpected error occurred. Please try again later.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-3">
        <i class="bi bi-house me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
