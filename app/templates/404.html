{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="text-center py-5">
    <div class="display-1 text-danger fw-bold"><i class="bi bi-exclamation-circle"></i> 404</div>
    <h3 class="fw-bold mt-3">Page Not Found</h3>
    <p class="text-muted">The requested page or resource could not be found.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-3">
        <i class="bi bi-house me-1"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
