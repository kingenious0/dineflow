{% extends "base.html" %}

{% block title %}Edit User - {{ user.full_name }}{% endblock %}

{% block page_header %}
<div class="page-header">
    <div>
        <h1><i class="bi bi-pencil-square me-2 text-primary-brand"></i>Edit Staff User</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('dashboard.index') }}">Dashboard</a></li>
                <li class="breadcrumb-item"><a href="{{ url_for('users.index') }}">Staff Users</a></li>
                <li class="breadcrumb-item active">Edit {{ user.full_name }}</li>
            </ol>
        </nav>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm-custom">
            <div class="card-header bg-white">
                <h5 class="mb-0 text-secondary">Edit Account Details</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('users.edit', user_id=user.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="full_name" class="form-label">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="full_name" name="full_name" value="{{ user.full_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="phone_number" class="form-label">Phone Number</label>
                            <input type="text" class="form-control" id="phone_number" name="phone_number" value="{{ user.phone_number or '' }}">
                        </div>
                        <div class="col-md-4">
                            <label for="role" class="form-label">System Role <span class="text-danger">*</span></label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="Staff" {% if user.role == 'Staff' %}selected{% endif %}>Staff</option>
                                <option value="Manager" {% if user.role == 'Manager' %}selected{% endif %}>Manager</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="status" class="form-label">Account Status <span class="text-danger">*</span></label>
                            <select class="form-select" id="status" name="status" required>
                                <option value="Active" {% if user.status == 'Active' %}selected{% endif %}>Active</option>
                                <option value="Inactive" {% if user.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                            </select>
                        </div>
                    </div>

                    <hr class="my-4">
                    <h6 class="text-secondary mb-3"><i class="bi bi-key me-1"></i> Reset Password (Optional)</h6>

                    <div class="mb-4">
                        <label for="new_password" class="form-label">New Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="new_password" name="new_password" minlength="6" placeholder="Leave blank to keep current password">
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('new_password', this)" title="Show/Hide Password">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('users.index') }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i> Update User</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
